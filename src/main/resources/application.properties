# Configuración para H2 (base de datos en memoria - MÁS FÁCIL)
spring.datasource.url=jdbc:h2:mem:despensa_inteligente
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Mostrar las consultas SQL generadas por Hibernate
spring.jpa.properties.hibernate.format_sql=true

# Activar logs detallados de SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Configuración para Tesseract OCR (GRATUITO)
# Tesseract se descarga automáticamente, no requiere configuración adicional
# Idiomas soportados: español (spa) + inglés (eng)

# Configuración para archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB